# ~/.config/starship/starship.toml

add_newline = false
palette = "gruvbox_dark"

# Left Prompt: extremely clean directory and custom prompt character
format = """$custom$directory$character"""

# Right Prompt: show git, language runtimes, cmd duration, and exit status
right_format = """$cmd_duration$git_branch$git_status$python$nodejs$golang$rust$aws$kubernetes$docker_context$status"""

command_timeout = 1000

# =========================================================
# CHARACTER
# =========================================================
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
vicmd_symbol = '[N] >>> '

# =========================================================
# DIRECTORY
# =========================================================
[directory]
style = "bold aqua"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

# =========================================================
# GIT
# =========================================================
[git_branch]
symbol = " "
style = "bold orange"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "󰯓 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = ""
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# =========================================================
# LANGUAGES & ENVIRONMENTS
# =========================================================
[python]
symbol = " "
style = "bold yellow"
format = 'via [$symbol$version]($style) '

[custom.venv]
command = 'echo "${VIRTUAL_ENV:-$CONDA_DEFAULT_ENV}" | xargs basename'
when = 'test -n "$VIRTUAL_ENV" -o -n "$CONDA_DEFAULT_ENV"'
format = '([\($output\)]($style) )'
style = "bold yellow"


[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "via [$symbol$version]($style) "

[golang]
symbol = " "
style = "bold aqua"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style = "bold orange"
format = "via [$symbol$version]($style) "

[aws]
symbol = " "
style = "bold blue"
format = 'via [$symbol$profile( \($region\))]($style) '
disabled = false

[kubernetes]
symbol = "☸ "
style = "bold aqua"
format = 'at [$symbol$context( \($namespace\))]($style) '
disabled = true

[docker_context]
symbol = "🐳 "
style = "bold blue"
format = "via [$symbol$context]($style) "
disabled = true

# =========================================================
# COMMAND DURATION & STATUS
# =========================================================
[cmd_duration]
min_time = 2000
style = "bold gray"
format = "took [$duration]($style) "

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
success_symbol = ""
style = "bold red"

# =========================================================
# PALETTES
# =========================================================
[palettes.gruvbox_dark]
# Bright colors for prompt accent
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
purple = "#d3869b"
aqua = "#8ec07c"
orange = "#fe8019"
gray = "#a89984"
black = "#282828"
white = "#ebdbb2"

# Dark Gruvbox palette versions
dark_red = "#cc241d"
dark_green = "#98971a"
dark_yellow = "#d79921"
dark_blue = "#458588"
dark_purple = "#b16286"
dark_aqua = "#689d6a"
dark_orange = "#d65d0e"
dark_gray = "#928374"
