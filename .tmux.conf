# ~/.tmux.conf

##### 🖥️ Terminal & Display Settings #####
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g mouse on

# Explicit shell (prevents instant exit on macOS)
set -g default-shell /bin/zsh


##### 🪟 Indexing #####
set -g base-index 1
set -g pane-base-index 1


##### ⌨️ Prefix Key #####
set -g prefix C-f
unbind C-b
set -g prefix2 none


##### 🔄 Reload Config #####
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


##### 🧩 Split Panes with Current Directory #####
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"


##### 🔍 Sessionizer & Session Creation #####
bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"
bind-key n command-prompt -p "New session:" "new-session -s '%%'"


##### 🪟 Select Panes with hjkl #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### 📐 Resize Panes with hjkl #####
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

##### 🪟 Toggle Zoom #####
bind -r m resize-pane -Z


##### 📂 Tmux Plugin Manager #####
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionizer'


##### 🛠 Plugin Configs #####
set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-boot "on"


##### 🎨 Catppuccin Theme #####
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"


##### 🌐 Online Status Icons #####
set -g @online_icon "ok"
set -g @offline_icon "nok"



### ⬅️ Status Left ###
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

### ➡️ Status Right ###
set -g status-right-length 100
set -g status-right ""



##### ⚙️ General Status Settings #####
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify centre


##### 🧱 Window Appearance #####
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I #W "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -g window-status-current-format " #I #W "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"


##### ✅ Load TPM (must be LAST) #####
if-shell "[ -f ~/.tmux/plugins/tpm/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"
