# ~/.tmux.conf

##### 🖥️ Terminal & Display Settings #####
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB,ghostty:RGB"
set -g allow-passthrough on

set -g mouse on
set -g focus-events on
set -sg escape-time 0

# Explicit shell (prevents instant exit on macOS)
set -g default-shell /bin/zsh


##### 🪟 Indexing #####
set -g base-index 1
set -g pane-base-index 1


##### ⌨️ Prefix Key #####
set -g prefix C-f
unbind C-b
set -g prefix2 none


##### 🔄 Reload Config #####
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


##### 🧩 Split Panes with Current Directory #####
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"


##### 🔍 Sessionizer & Session Creation #####
bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"
bind-key n command-prompt -p "New session:" "new-session -s '%%'"

##### 🪟 Select Panes with hjkl #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### 🪟 Switch Windows (Prefix + Shift + H/L) #####
bind H previous-window
bind L next-window

##### 🪟 Switch Windows with Numbers (Prefix + 1-9) #####
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

##### 📐 Resize Panes with hjkl #####
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

##### 🪟 Toggle Zoom #####
bind -r m resize-pane -Z


##### 📂 Tmux Plugin Manager #####
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


##### 🛠 Plugin Configs #####
set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval '5'



##### 🎨 Gruvbox Theme Colors (thm Variable Mapping) #####
set -g @thm_bg "#282828"          # Gruvbox Material dark background
set -g @thm_fg "#ddc7a1"          # Gruvbox Material light foreground
set -g @thm_red "#ea6962"         # Gruvbox Material red
set -g @thm_green "#a9b665"       # Gruvbox Material green
set -g @thm_yellow "#d8a657"      # Gruvbox Material yellow
set -g @thm_blue "#7daea3"        # Gruvbox Material blue
set -g @thm_purple "#d3869b"      # Gruvbox Material purple
set -g @thm_aqua "#89b482"        # Gruvbox Material aqua
set -g @thm_orange "#e78a4e"      # Gruvbox Material orange
set -g @thm_overlay_0 "#928374"   # Gruvbox Material gray (neutral/bright gray)
set -g @thm_rosewater "#c7b89d"   # Gruvbox Material light gray/rosewater
set -g @thm_peach "#e78a4e"       # Gruvbox Material orange/peach


##### 🌐 Online Status Icons #####
set -g @online_icon "#[fg=#{@thm_green}]󰖩"
set -g @offline_icon "#[fg=#{@thm_red}]󰖪"



### ⬅️ Status Left ###
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#[fg=#{@thm_bg} bg=#{@thm_red} bold]  #S ,#[fg=#{@thm_green} bg=#{@thm_bg} bold]  #S }"
set -ga status-left "#[fg=#{@thm_overlay_0} bg=#{@thm_bg}]│"
set -ga status-left "#[fg=#{@thm_blue} bg=#{@thm_bg}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#{?window_zoomed_flag,#[fg=#{@thm_overlay_0} bg=#{@thm_bg}]│#[fg=#{@thm_yellow} bg=#{@thm_bg}]  zoom ,}"

### ➡️ Status Right ###
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[fg=#{@thm_purple} bg=#{@thm_bg}] 󰁹 #{battery_percentage} "
set -ga status-right "#[fg=#{@thm_overlay_0} bg=#{@thm_bg}]│"
set -ga status-right "#[fg=#{@thm_blue} bg=#{@thm_bg}] 󱑒 %I:%M %p "



##### ⚙️ General Status Settings #####
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify centre
set -g status-interval 5


##### 🧱 Window Appearance #####
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #[fg=#{@thm_rosewater} bg=#{@thm_bg}]#I #W "
set -g window-status-style "bg=#{@thm_bg}"
set -g window-status-last-style "fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -g window-status-current-format " #[fg=#{@thm_bg} bg=#{@thm_peach} bold] #I #W "
set -g window-status-separator "#[fg=#{@thm_overlay_0} bg=#{@thm_bg}]│"


##### ✅ Load TPM (must be LAST) #####
if-shell "[ -f ~/.tmux/plugins/tpm/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"
