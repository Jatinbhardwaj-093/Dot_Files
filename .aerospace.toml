# =========================================================
# AeroSpace Configuration
# Gruvbox + SketchyBar + Hyper Key Setup
# =========================================================

config-version = 2

start-at-login = true

after-startup-command = ['exec-and-forget /Users/jatinbhardwaj/.config/aerospace/update-gaps.sh']

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["Terminal", "Browser", "Chat", "Obsidian", "Research", "1", "2", "3"]

on-mode-changed = []

[key-mapping]
preset = 'qwerty'

# =========================================================
# GAPS
# =========================================================

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 54
outer.right = 10

# =========================================================
# MAIN MODE
# Hyper Key = Right Ctrl -> ctrl + alt + cmd
# =========================================================

[mode.main.binding]

# Layouts
alt-ctrl-cmd-slash = 'layout tiles horizontal vertical'
alt-ctrl-cmd-comma = 'layout accordion horizontal vertical'
cmd-e = 'exec-and-forget /Users/jatinbhardwaj/.config/aerospace/toggle-space-layout.sh'

# Focus
alt-ctrl-cmd-h = 'focus left'
alt-ctrl-cmd-j = 'focus down'
alt-ctrl-cmd-k = 'focus up'
alt-ctrl-cmd-l = 'focus right'

# Move Windows
alt-ctrl-cmd-shift-h = 'move left'
alt-ctrl-cmd-shift-j = 'move down'
alt-ctrl-cmd-shift-k = 'move up'
alt-ctrl-cmd-shift-l = 'move right'

# Resize
alt-ctrl-cmd-minus = 'resize smart -20'
alt-ctrl-cmd-equal = 'resize smart +20'

# Workspaces
alt-ctrl-cmd-1 = 'workspace 1'
alt-ctrl-cmd-2 = 'workspace 2'
alt-ctrl-cmd-3 = 'workspace 3'

# Named Workspaces
alt-ctrl-cmd-t = ['workspace Terminal', 'exec-and-forget open -a Ghostty']
alt-ctrl-cmd-b = ['workspace Browser', 'exec-and-forget open -a Safari']
alt-ctrl-cmd-c = ['workspace Chat', 'exec-and-forget open -a Legcord']
alt-ctrl-cmd-o = ['workspace Obsidian', 'exec-and-forget open -a Obsidian']
alt-ctrl-cmd-r = ['workspace Research', 'exec-and-forget open -a Zotero']

# Move Window To Workspace (And switch focus to it)
alt-ctrl-cmd-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-ctrl-cmd-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-ctrl-cmd-shift-3 = ['move-node-to-workspace 3', 'workspace 3']

alt-ctrl-cmd-shift-t = ['move-node-to-workspace Terminal', 'workspace Terminal']
alt-ctrl-cmd-shift-b = ['move-node-to-workspace Browser', 'workspace Browser']
alt-ctrl-cmd-shift-c = ['move-node-to-workspace Chat', 'workspace Chat']
alt-ctrl-cmd-shift-o = ['move-node-to-workspace Obsidian', 'workspace Obsidian']
alt-ctrl-cmd-shift-r = ['move-node-to-workspace Research', 'workspace Research']

# Workspace Navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'


# Terminal & Browser shortcuts are now integrated directly into the workspace navigation keys.
# Finder
alt-ctrl-cmd-e = 'exec-and-forget open -a Finder'

# Service Mode
alt-ctrl-cmd-semicolon = 'mode service'

# =========================================================
# SERVICE MODE
# =========================================================

[mode.service.binding]

esc = ['reload-config', 'mode main']

r = ['flatten-workspace-tree', 'mode main']

f = ['layout floating tiling', 'mode main']

backspace = ['close-all-windows-but-current', 'mode main']

alt-ctrl-cmd-shift-h = ['join-with left', 'mode main']
alt-ctrl-cmd-shift-j = ['join-with down', 'mode main']
alt-ctrl-cmd-shift-k = ['join-with up', 'mode main']
alt-ctrl-cmd-shift-l = ['join-with right', 'mode main']

# =========================================================
# AUTO WORKSPACE ASSIGNMENTS
# =========================================================

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace Browser'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace Terminal'

[[on-window-detected]]
if.app-id = 'app.legcord.Legcord'
run = 'move-node-to-workspace Chat'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['layout floating', 'move-node-to-workspace Obsidian']

[[on-window-detected]]
if.app-id = 'org.zotero.zotero'
run = 'move-node-to-workspace Research'


# =========================================================
# FLOATING APPS
# =========================================================

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Photo-Booth'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Dictionary'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Stickies'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ScreenContinuity'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.localsend.localsendApp'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

